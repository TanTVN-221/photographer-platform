name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          # Disposable isolated CI service only, never an application secret.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: photographer_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d photographer_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Prisma
        run: pnpm --filter @photographer-platform/database db:validate
      - name: Build all packages and apps
        run: pnpm build
      - name: Typecheck all packages and apps
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Apply migrations to the disposable test database
        run: pnpm --filter @photographer-platform/database db:deploy
        env:
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/photographer_platform_test
      - name: Unit, HTTP, render and real PostgreSQL tests
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/photographer_platform_test
